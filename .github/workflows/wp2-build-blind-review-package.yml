name: WP2 Build Blinded Gold Review Package

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wp2-build-blind-review-package.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: My_work/03_data/pilot
        run: pip install -r requirements.txt
      - name: Build blinded package
        working-directory: My_work/03_data/pilot
        run: python build_blind_review_package.py
      - name: Commit review package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add My_work/03_data/pilot/output/human_review_blind_300.csv \
                  My_work/03_data/pilot/output/human_review_prediction_map_300.jsonl \
                  My_work/03_data/pilot/output/human_review_manifest.json
          if git diff --cached --quiet; then echo 'No package changes'; else
            git commit -m 'WP2: build blinded 300-record gold review package'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
