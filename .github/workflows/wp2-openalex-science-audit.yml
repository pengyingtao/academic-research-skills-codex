name: WP2 OpenAlex Science Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wp2-openalex-science-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: My_work/03_data/pilot
        run: pip install -r requirements.txt
      - name: Build Science audit and crosswalk
        working-directory: My_work/03_data/pilot
        run: python build_openalex_science_audit.py
      - name: Commit Science audit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add My_work/03_data/pilot/output/openalex_science_audit_60.jsonl \
                  My_work/03_data/pilot/output/openalex_science_audit_60.csv \
                  My_work/03_data/pilot/output/openalex_science_crosswalk.json
          if git diff --cached --quiet; then echo 'No Science audit changes'; else
            git commit -m 'WP2: persist stratified OpenAlex Science audit'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
