name: WP2 Rescreen Screening V1.3.2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wp2-rescreen-v1-3-2.yml'

permissions:
  contents: write

jobs:
  rescreen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: My_work/03_data/pilot
        run: pip install -r requirements.txt
      - name: Run v1.3.2 regression tests
        working-directory: My_work/03_data/pilot
        run: python -m unittest -v test_pilot_logic.py
      - name: Preserve v1.3.1 record-level baseline
        working-directory: My_work/03_data/pilot
        run: cp output/pilot_screened.jsonl /tmp/pilot_screened_v1_3_1.jsonl
      - name: Rescreen same 950-record corpus
        working-directory: My_work/03_data/pilot
        run: python screen_candidates.py output/github_candidates.jsonl output/vdp_at_2026-06-30.jsonl
      - name: Summarize v1.3.2 and rebuild review queue
        working-directory: My_work/03_data/pilot
        run: |
          python summarize_pilot.py --input output/pilot_screened.jsonl --out output/pilot_summary.json
          cp output/pilot_summary.json analysis/pilot_summary_keyword_v1_3_2.json
          python build_review_queue.py --input output/pilot_screened.jsonl --n 300
      - name: Compare v1.3.1 and v1.3.2 record labels
        working-directory: My_work/03_data/pilot
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          def load(path):
              out = {}
              for line in Path(path).read_text(encoding='utf-8').splitlines():
                  if line.strip():
                      r = json.loads(line)
                      out[(r.get('source_type'), r.get('source_native_id'))] = r
              return out

          old = load('/tmp/pilot_screened_v1_3_1.jsonl')
          new = load('output/pilot_screened.jsonl')
          fields = ['in_scope','primary_technology_id','secondary_technology_ids','false_positive_type','confidence']
          changed = []
          field_counts = Counter()
          scope_transitions = Counter()
          primary_transitions = Counter()
          for key in sorted(set(old) & set(new)):
              a, b = old[key], new[key]
              diffs = [f for f in fields if a.get(f) != b.get(f)]
              if not diffs:
                  continue
              for f in diffs:
                  field_counts[f] += 1
              scope_transitions[f"{a.get('in_scope')}->{b.get('in_scope')}"] += 1
              primary_transitions[f"{a.get('primary_technology_id')}->{b.get('primary_technology_id')}"] += 1
              changed.append({
                  'source_type': b.get('source_type'),
                  'source_native_id': b.get('source_native_id'),
                  'title_or_name': b.get('title_or_name'),
                  'candidate_family': b.get('candidate_family'),
                  'changed_fields': diffs,
                  'v1_3_1_in_scope': a.get('in_scope'),
                  'v1_3_2_in_scope': b.get('in_scope'),
                  'v1_3_1_primary': a.get('primary_technology_id'),
                  'v1_3_2_primary': b.get('primary_technology_id'),
                  'v1_3_1_false_positive': a.get('false_positive_type'),
                  'v1_3_2_false_positive': b.get('false_positive_type'),
                  'evidence_excerpt': (b.get('text_evidence') or '').replace('\n',' ')[:1600],
                  'review_status': None,
                  'review_note': None,
              })

          report = {
              'n_common': len(set(old) & set(new)),
              'n_changed': len(changed),
              'change_field_counts': dict(field_counts),
              'scope_transitions': dict(scope_transitions),
              'primary_transitions': dict(primary_transitions),
              'intended_changes': [
                  'reference/arxiv feeds -> AGGREGATOR_NOT_TOOL',
                  'T02 requires strong code-level repair/patch-generation evidence',
                  'T12 expanded for vulnerability intelligence/risk/prioritization'
              ],
              'acceptance_guardrail': 'Accept only if changes remain narrow and targeted-review consistent. This is not gold accuracy evidence.'
          }
          Path('analysis/screening_regression_v1_3_1_to_v1_3_2.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          with Path('analysis/screening_changed_records_v1_3_1_to_v1_3_2.jsonl').open('w', encoding='utf-8') as f:
              for r in changed:
                  f.write(json.dumps(r, ensure_ascii=False) + '\n')
          print(json.dumps(report, indent=2))
          PY
      - name: Write rescreen metadata
        working-directory: My_work/03_data/pilot
        run: |
          python - <<'PY'
          import json, datetime
          from pathlib import Path
          meta = {
            'run_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'mode': 'RESCREEN_EXISTING_FORMAL_CORPUS',
            'taxonomy_version': '1.1',
            'screening_version': '1.3.2',
            'external_api_calls': False,
            'input_n_expected': 950,
            'note': 'Narrow rule patch after bidirectional audit: reference-feed exclusion and T02/T12 boundary.'
          }
          Path('analysis/rescreen_v1_3_2_metadata.json').write_text(json.dumps(meta, indent=2), encoding='utf-8')
          PY
      - name: Commit v1.3.2 outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add My_work/03_data/pilot/output/pilot_screened.jsonl \
                  My_work/03_data/pilot/output/pilot_summary.json \
                  My_work/03_data/pilot/output/manual_review_queue_compact.jsonl \
                  My_work/03_data/pilot/output/manual_review_queue_compact.csv \
                  My_work/03_data/pilot/analysis/pilot_summary_keyword_v1_3_2.json \
                  My_work/03_data/pilot/analysis/screening_regression_v1_3_1_to_v1_3_2.json \
                  My_work/03_data/pilot/analysis/screening_changed_records_v1_3_1_to_v1_3_2.jsonl \
                  My_work/03_data/pilot/analysis/rescreen_v1_3_2_metadata.json
          if git diff --cached --quiet; then
            echo 'No v1.3.2 changes.'
          else
            git commit -m 'WP2: rescreen formal Pilot with screening v1.3.2'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
