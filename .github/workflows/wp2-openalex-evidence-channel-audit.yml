name: WP2 OpenAlex Evidence Channel Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wp2-openalex-evidence-channel-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: My_work/03_data/pilot
        run: pip install -r requirements.txt
      - name: Audit OpenAlex evidence channels
        working-directory: My_work/03_data/pilot
        run: python analyze_openalex_evidence_channels.py
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add My_work/03_data/pilot/output/openalex_evidence_channel_diagnostics.json
          if git diff --cached --quiet; then echo 'No diagnostic changes'; else
            git commit -m 'WP2: persist OpenAlex evidence-channel diagnostic'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
