name: WP2 OpenAlex Keyless Access Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wp2-openalex-access-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe one official OpenAlex request
        working-directory: My_work/03_data/pilot
        shell: bash
        run: |
          python - <<'PY'
          import datetime, json, pathlib, time, urllib.parse, urllib.request, urllib.error
          base='https://api.openalex.org/works'
          params={
              'search':'machine learning cybersecurity',
              'filter':'from_publication_date:2012-01-01,to_publication_date:2026-06-30',
              'per_page':1,
              'select':'id,title,publication_date'
          }
          url=base+'?'+urllib.parse.urlencode(params)
          t=time.time()
          status='ERROR'
          http_status=None
          error=None
          n=0
          try:
              req=urllib.request.Request(url,headers={'User-Agent':'academic-research-pilot/1.0'})
              with urllib.request.urlopen(req,timeout=15) as r:
                  http_status=getattr(r,'status',200)
                  data=json.loads(r.read().decode('utf-8'))
                  n=len(data.get('results',[]))
                  status='PASS' if n else 'PASS_EMPTY'
          except urllib.error.HTTPError as exc:
              http_status=exc.code
              try:
                  error=exc.read().decode('utf-8',errors='replace')[:500]
              except Exception:
                  error=repr(exc)
              status='HTTP_ERROR'
          except Exception as exc:
              error=repr(exc)
              status='EXCEPTION'
          payload={
              'run_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'status':status,
              'http_status':http_status,
              'result_count':n,
              'elapsed_seconds':round(time.time()-t,3),
              'api_key_used':False,
              'error_excerpt':error,
              'note':'Isolated diagnostic only; does not modify formal OpenAlex candidate corpus.'
          }
          pathlib.Path('output/openalex_keyless_access_probe.json').write_text(json.dumps(payload,indent=2),encoding='utf-8')
          print(json.dumps(payload,indent=2))
          PY
      - name: Commit probe evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add My_work/03_data/pilot/output/openalex_keyless_access_probe.json
          git commit -m 'WP2: persist OpenAlex keyless access probe' || exit 0
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
