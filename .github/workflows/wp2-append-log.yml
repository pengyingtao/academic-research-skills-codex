name: WP2 Append Execution Log

on:
  push:
    paths:
      - '.github/workflows/wp2-append-log.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append WP2 execution record
        shell: bash
        run: |
          cat >> 'My_work/执行记录/执行日志.md' <<'EOF'

