name: WP2 Screening Audit Diagnostics V1.3.2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wp2-audit-diagnostics-v1-3-2.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: My_work/03_data/pilot
        run: pip install -r requirements.txt
      - name: Diagnose audit samples
        working-directory: My_work/03_data/pilot
        run: python analyze_screening_audits.py
      - name: Commit diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add My_work/03_data/pilot/output/screening_audit_diagnostics_v1_3_2.json
          if git diff --cached --quiet; then echo 'No diagnostic changes'; else
            git commit -m 'WP2: persist v1.3.2 screening audit diagnostics'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
