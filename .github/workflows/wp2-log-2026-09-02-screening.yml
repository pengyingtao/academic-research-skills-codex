          判断：变化幅度过大，**V1.3 不得直接冻结**，必须进行 targeted false-negative review。

          ### V1.3 SOC substring bug

          高优先级样本检查发现代码问题：

          原逻辑使用：

          `"soc" in central_text`

          这会把 `associated` 等包含字符序列 `soc` 的普通单词误判成 SOC，从而错误触发 T09 priority。

          已修订为：

          - `\bsoc\b` exact word boundary；
          - 或明确 `security operations center/centre`；
          - offensive/defensive context 也使用同一严格 SOC 判断；
          - 新增回归测试，明确 `associated` 不得触发 SOC。

