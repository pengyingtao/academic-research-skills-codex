          ### AI Pre-review 与 Human Gold 严格分离

          新建：

          `My_work/03_data/pilot/ai_prereview_protocol.md`

          规则：

          - AI 只能生成 `AI_PREREVIEW_*` 建议；
          - AI 不得写入 `gold_status=AGREED/ADJUDICATED`；
          - `evaluate_gold.py` 继续只统计真正完成独立/人工终审的 gold records；
          - 未完成 human gold 前的任何一致率/性能均必须标 `PROVISIONAL`。

          已完成 AI targeted pre-review：

