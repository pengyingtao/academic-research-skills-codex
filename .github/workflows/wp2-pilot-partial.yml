name: WP2 Partial Pilot Collection

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wp2-pilot-partial.yml'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: My_work/03_data/pilot
        run: pip install -r requirements.txt
      - name: Verify Pilot logic before collection
        working-directory: My_work/03_data/pilot
        run: python -m unittest -v test_pilot_logic.py
      - name: Collect formal GitHub sample with AI anchors
        working-directory: My_work/03_data/pilot
        run: python collect_github.py --per-family 14 --max-total 140 --max-auxiliary 60 --cutoff 2026-06-30
      - name: Collect formal windowed NVD sample
        working-directory: My_work/03_data/pilot
        run: python collect_nvd.py --max-total 140 --per-cwe 5 --formal-windowed
      - name: Materialize VDP at research cutoff
        working-directory: My_work/03_data/pilot
        run: python materialize_vdp_at_cutoff.py --input output/nvd_candidates.jsonl --cutoff 2026-06-30 --out output/vdp_at_2026-06-30.jsonl
      - name: Screen formal partial sample with hard AI gate
        working-directory: My_work/03_data/pilot
        run: python screen_candidates.py output/github_candidates.jsonl output/vdp_at_2026-06-30.jsonl
      - name: Summarize Pilot batch
        working-directory: My_work/03_data/pilot
        run: python summarize_pilot.py --input output/pilot_screened.jsonl --out output/pilot_summary.json
      - name: Build partial manual review queue
        working-directory: My_work/03_data/pilot
        run: python build_review_queue.py --input output/pilot_screened.jsonl --n 220
      - name: Write run metadata
        working-directory: My_work/03_data/pilot
        run: |
          python - <<'PY'
          import json, pathlib, datetime
          out = pathlib.Path('output')
          meta = {
            'run_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'sources': ['github', 'nvd'],
            'mode': 'FORMAL_PARTIAL_HISTORICAL_PILOT_HARDENED',
            'research_cutoff': '2026-06-30',
            'target': {'github_main': 140, 'nvd': 140, 'github_auxiliary_cap': 60},
            'taxonomy_version': '1.1',
            'keyword_version': '1.1',
            'github_rule': 'family capability term x AI search anchor; semantic hard AI gate; created_at <= 2026-06-30; mutable popularity metrics excluded from historical feature claims',
            'nvd_rule': 'deterministic <=120-day publication windows spanning 2012Q1-2026Q2',
            'vdp_materialization': 'CISA kev-data Git snapshot when cutoff is covered by mirror history; explicitly flagged dateAdded approximation before mirror history; EPSS(date=cutoff) when structurally available',
            'note': 'Hardened GitHub+VDP sub-batch for Gate 2B. Full Gate still requires OpenAlex and Patent supply plus >=300 finalized gold-reviewed records.'
          }
          (out / 'partial_run_metadata.json').write_text(json.dumps(meta, indent=2), encoding='utf-8')
          PY
      - name: Commit generated Pilot batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add My_work/03_data/pilot/output
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'WP2: collect hardened formal partial historical Pilot batch'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
