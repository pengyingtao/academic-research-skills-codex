name: WP2 Rescreen Screening V1.3.1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wp2-rescreen-v1-3-1.yml'

permissions:
  contents: write

jobs:
  rescreen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: My_work/03_data/pilot
        run: pip install -r requirements.txt
      - name: Run v1.3.1 tests
        working-directory: My_work/03_data/pilot
        run: python -m unittest -v test_pilot_logic.py
      - name: Materialize v1.3 baseline
        run: git show 6a5963c27a0bfaabec66eec66d336044deb4bece:My_work/03_data/pilot/output/pilot_screened.jsonl > /tmp/pilot_screened_v1_3.jsonl
      - name: Rescreen same 950-record corpus
        working-directory: My_work/03_data/pilot
        run: python screen_candidates.py output/github_candidates.jsonl output/vdp_at_2026-06-30.jsonl
      - name: Summarize v1.3.1
        working-directory: My_work/03_data/pilot
        run: |
          python summarize_pilot.py --input output/pilot_screened.jsonl --out output/pilot_summary.json
          cp output/pilot_summary.json analysis/pilot_summary_keyword_v1_3_1.json
          python build_review_queue.py --input output/pilot_screened.jsonl --n 300
      - name: Compare v1.3 and v1.3.1 record labels
        working-directory: My_work/03_data/pilot
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          def load(path):
              out={}
              for line in Path(path).read_text(encoding='utf-8').splitlines():
                  if line.strip():
                      r=json.loads(line); out[(r.get('source_type'),r.get('source_native_id'))]=r
              return out
          a=load('/tmp/pilot_screened_v1_3.jsonl'); b=load('output/pilot_screened.jsonl')
          fam=Counter(); scope=Counter(); changed=[]
          for k in sorted(set(a)&set(b)):
              x,y=a[k],b[k]
              if x.get('in_scope')!=y.get('in_scope') or x.get('primary_technology_id')!=y.get('primary_technology_id') or x.get('false_positive_type')!=y.get('false_positive_type'):
                  changed.append({
                    'source_type':y.get('source_type'),'source_native_id':y.get('source_native_id'),'title_or_name':y.get('title_or_name'),
                    'v1_3_in_scope':x.get('in_scope'),'v1_3_1_in_scope':y.get('in_scope'),
                    'v1_3_primary':x.get('primary_technology_id'),'v1_3_1_primary':y.get('primary_technology_id'),
                    'v1_3_false_positive':x.get('false_positive_type'),'v1_3_1_false_positive':y.get('false_positive_type'),
                    'evidence_excerpt':(y.get('text_evidence') or '').replace('\n',' ')[:1200]
                  })
                  scope[f"{x.get('in_scope')}->{y.get('in_scope')}"]+=1
                  fam[f"{x.get('primary_technology_id')}->{y.get('primary_technology_id')}"]+=1
          report={'n_common':len(set(a)&set(b)),'n_changed':len(changed),'scope_transitions':dict(scope),'primary_transitions':dict(fam),'patch':'SOC exact-token/phrase matching; removes substring bug'}
          Path('analysis/screening_regression_v1_3_to_v1_3_1.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          with Path('analysis/screening_changed_records_v1_3_to_v1_3_1.jsonl').open('w',encoding='utf-8') as f:
              for r in changed: f.write(json.dumps(r,ensure_ascii=False)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Commit v1.3.1 outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add My_work/03_data/pilot/output/pilot_screened.jsonl \
                  My_work/03_data/pilot/output/pilot_summary.json \
                  My_work/03_data/pilot/output/manual_review_queue_compact.jsonl \
                  My_work/03_data/pilot/output/manual_review_queue_compact.csv \
                  My_work/03_data/pilot/analysis/pilot_summary_keyword_v1_3_1.json \
                  My_work/03_data/pilot/analysis/screening_regression_v1_3_to_v1_3_1.json \
                  My_work/03_data/pilot/analysis/screening_changed_records_v1_3_to_v1_3_1.jsonl
          if git diff --cached --quiet; then echo 'No changes'; else
            git commit -m 'WP2: patch and rescreen with version 1.3.1'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
