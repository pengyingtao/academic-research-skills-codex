version: "1.0"
status: "PILOT"
updated: "2026-09-01"
purpose: "Represent vulnerability-side demand pressure separately from AI cybersecurity technology supply labels."

principles:
  - "CVE/CWE/KEV/EPSS records do not receive T01-T15 technology labels directly."
  - "VDP is a demand-side state channel; technology-family effects are learned/validated later rather than treated as ground truth."
  - "All time-varying fields must be stored point-in-time for historical backtesting."
  - "EPSS is optional but recommended as a V-layer exploit-likelihood feature; historical scores must not be backfilled from current values."

vdp_state_vector:
  required_features:
    - cve_count
    - cve_growth
    - cvss_base_mean
    - cvss_base_p90
    - cvss_exploitability_mean
    - kev_count
    - kev_rate
    - cwe_diversity
    - affected_vendor_count
    - affected_product_count
  optional_features:
    - epss_mean
    - epss_p90
    - epss_high_risk_count
    - patch_reference_rate
    - exploit_reference_rate
    - median_days_to_patch_reference

aggregation:
  default: "Do not freeze arbitrary weights at WP2. Preserve the feature vector and let later evidence-calibration models learn weights."
  exploratory_index: "A normalized VDP composite may be tested only as a baseline and must be compared with raw feature-vector models."

weakness_groups:
  - id: W01
    name: "Memory safety and low-level code flaws"
    example_cwes: [CWE-119, CWE-120, CWE-125, CWE-787, CWE-416, CWE-476, CWE-190]
    likely_pressure_targets:
      primary: [T01, T02, T15]
      secondary: [T12]
    note: "Pressure link indicates plausible demand relevance, not technology ground truth."

  - id: W02
    name: "Injection, traversal and unsafe interpretation"
    example_cwes: [CWE-20, CWE-22, CWE-78, CWE-79, CWE-89, CWE-94, CWE-502, CWE-918]
    likely_pressure_targets:
      primary: [T01, T02, T15]
      secondary: [T12, T10]

  - id: W03
    name: "Authentication, authorization and privilege weaknesses"
    example_cwes: [CWE-284, CWE-287, CWE-306, CWE-269, CWE-862, CWE-863, CWE-798]
    likely_pressure_targets:
      primary: [T13, T15, T12]
      secondary: [T01, T02]

  - id: W04
    name: "Cryptography, credential and secret protection weaknesses"
    example_cwes: [CWE-312, CWE-319, CWE-321, CWE-326, CWE-327, CWE-522]
    likely_pressure_targets:
      primary: [T13, T15, T12]
      secondary: [T01]

  - id: W05
    name: "Configuration, dependency and supply-chain exposure"
    example_cwes: [CWE-16, CWE-1104]
    likely_pressure_targets:
      primary: [T15, T12]
      secondary: [T01, T02, T10]
    note: "CWE coverage for supply-chain risk is incomplete; CPE/vendor/advisory context is required."

  - id: W06
    name: "Availability and resource-exhaustion weaknesses"
    example_cwes: [CWE-400, CWE-770, CWE-835]
    likely_pressure_targets:
      primary: [T12, T10]
      secondary: [T06, T01, T02]

  - id: W07
    name: "Concurrency, state and logic weaknesses"
    example_cwes: [CWE-362]
    likely_pressure_targets:
      primary: [T01, T02, T15]
      secondary: [T12]

  - id: W99
    name: "Other / insufficiently specific weakness"
    example_cwes: []
    likely_pressure_targets:
      primary: [T12]
      secondary: []
    note: "Use only when reliable weakness grouping is unavailable."

systemic_pressure:
  description: "Cross-family operational pressure generated by real-world exploitation, independent of one specific CWE group."
  signals:
    - KEV inclusion
    - EPSS probability and percentile
    - public exploit reference
    - repeated exploitation-related advisory references
    - high CVSS exploitability metrics
  plausible_targets:
    - T07
    - T08
    - T09
    - T10
    - T12
  warning: "These mappings define hypotheses for downstream estimation. They must not be encoded as positive labels during model training."

point_in_time_schema:
  cve_snapshot_fields:
    - observed_at
    - published_at
    - modified_at_as_observed
    - cwe_as_observed
    - cvss_as_observed
    - cpe_as_observed
    - kev_status_as_observed
    - kev_added_date
    - epss_score_as_observed
    - epss_percentile_as_observed
  leakage_rules:
    - "Never use future KEV inclusion in an earlier fold."
    - "Never use current EPSS as the historical EPSS value."
    - "Never use later NVD enrichment/modified fields as if known at CVE publication date."

validation_plan:
  comparisons:
    - raw_cve_count_only
    - cvss_only
    - cve_plus_kev
    - cve_plus_kev_plus_epss
    - full_vdp_feature_vector
  key_question: "Does VDP add out-of-sample predictive value for later AI cybersecurity research, patenting, engineering activity, emergence or convergence?"
