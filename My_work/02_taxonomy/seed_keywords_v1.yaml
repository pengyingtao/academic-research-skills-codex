screening_logic:
  rule_1: "Require at least one AI term and one cybersecurity capability term unless the source is already in a domain-specific corpus."
  rule_2: "Assign one primary Txx family based on defensive objective; allow secondary labels when the contribution genuinely spans multiple operational capabilities."
  rule_3: "Do not classify solely from title keywords when abstract/readme/claims provide contradictory evidence."
  rule_4: "For GitHub, use README/topics/dependencies/release descriptions in addition to repository name."
  rule_5: "For patents, prioritize abstract/claims/CPC context over title-only matches."
  rule_6: "For CVE-linked records, map to a defensive technology only when there is a defensible relationship to detection, analysis, remediation, prioritization or response—not merely because a CVE exists."
